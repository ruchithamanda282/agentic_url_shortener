<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic URL Shortener</title><style>
body{font-family:Arial,sans-serif;max-width:1100px;margin:30px auto;padding:0 18px;background:#f7f8fa;color:#17202a}h1{margin-bottom:4px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0;box-shadow:0 1px 4px #ddd}input,select,button{padding:10px;margin:5px 0;border:1px solid #bbb;border-radius:6px}input{width:70%}button{cursor:pointer;background:#17202a;color:white}.stage{display:inline-block;padding:7px;margin:4px;border-radius:5px;background:#eee;font-size:12px}.ok{background:#c9f7d5}.wait{background:#fff0b3}.bad{background:#ffd0d0}pre{white-space:pre-wrap;max-height:360px;overflow:auto;background:#101418;color:#e7edf3;padding:12px;border-radius:6px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>
<h1>Agentic URL Shortener</h1><p>URL shortening + analytics + governed SDLC workflow orchestration.</p>
<div class="card"><h2>1. Shorten a URL</h2><div class="row"><input id="url" placeholder="https://example.com/very/long/url"><button onclick="shorten()">Shorten</button></div><pre id="urlOut"></pre></div>
<div class="card"><h2>2. Run Agentic SDLC Workflow</h2><select id="scenario"><option>GREENFIELD</option><option>BROWNFIELD</option><option>AMBIGUOUS</option></select><input id="req" value="Build a URL shortener with analytics and reliability features" style="width:60%"><div><label><input type="checkbox" id="auto"> Auto-approve demo gates</label> <button onclick="startWorkflow()">Start Workflow</button></div><input id="wid" placeholder="Workflow ID" style="width:60%"><button onclick="refresh()">Refresh</button> <button onclick="approve()">Approve Next Gate</button> <button onclick="stopWorkflow()">Safe Stop</button> <button onclick="replan()">Re-plan</button><div id="workflowOut"></div></div>
<script>
const j=async(u,o={})=>{let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):{}};
async function shorten(){try{let x=await j('/api/urls',{method:'POST',body:JSON.stringify({url:document.getElementById('url').value,createdBy:'demo-ui'})});document.getElementById('urlOut').textContent=JSON.stringify(x,null,2)}catch(e){document.getElementById('urlOut').textContent=e}}
async function startWorkflow(){try{let x=await j('/api/workflows',{method:'POST',body:JSON.stringify({scenario:scenario.value,requirement:req.value,autoApprove:auto.checked})});wid.value=x.workflowId;render(x)}catch(e){workflowOut.textContent=e}}
async function refresh(){if(!wid.value)return;render(await j('/api/workflows/'+wid.value))}
async function approve(){if(!wid.value)return;let x=await j('/api/workflows/'+wid.value+'/approve',{method:'POST',body:JSON.stringify({stage:nextGate(),approved:true,reason:'Human reviewer approved in demo UI'})});await refresh()}
function nextGate(){let s=window.workflow;for(let k of ['REQUIREMENTS','IMPLEMENTATION','RELEASE'])if(s.stages[k].status!=='SUCCEEDED')return k;return 'RELEASE'}
async function stopWorkflow(){if(wid.value){await fetch('/api/workflows/'+wid.value+'/stop?reason=Operator%20requested%20safe-stop',{method:'POST'});await refresh()}}
async function replan(){if(wid.value){await j('/api/workflows/'+wid.value+'/replan',{method:'POST',body:JSON.stringify({requirement:req.value+' (updated after stakeholder feedback)'})});await refresh()}}
function render(s){window.workflow=s;let h='<p><b>Status:</b> '+s.status+' | <b>Retries:</b> '+s.retryCount+' | <b>Rollbacks:</b> '+s.rollbackCount+'</p><div>';for(let k of Object.keys(s.stages)){let x=s.stages[k];h+='<span class="stage '+(x.status==='SUCCEEDED'?'ok':(x.status.includes('FAILED')?'bad':'wait'))+'">'+k+': '+x.status+'</span>'}h+='</div><h3>Audit trail</h3><pre>'+s.audit.join('\n')+'</pre><h3>Latest stage outputs</h3><pre>'+Object.values(s.stages).filter(x=>x.output).map(x=>'## '+x.stage+'\n'+x.output).join('\n\n')+'</pre>';workflowOut.innerHTML=h}
</script></body></html>
